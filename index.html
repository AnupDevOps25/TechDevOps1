<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #24324a;
            background: #eef4ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #eef4ff, #dce8ff);
        }

        .login-card {
            width: min(100%, 400px);
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(38, 74, 132, 0.15);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #64748b;
            text-align: center;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        .help {
            display: block;
            margin-top: 18px;
            color: #2563eb;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Welcome DevOps Class</h1>
        <p class="subtitle">Sign in to continue to your account</p>
        <form>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Log in</button>
        </form>
        <a class="help" href="#">Forgot your password?</a>
    </main>
</body>
</html>
